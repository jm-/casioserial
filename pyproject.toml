[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "casioserial"
description = "Serial protocol library and CLI for Casio fx-series calculators (fx-9750G PLUS and relatives)"
authors = [
    { name = "Julian Melchert", email = "5569555+jm-@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
keywords = ["casio", "calculator", "serial", "g1m"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Hardware",
    "Topic :: Terminals :: Serial",
]
dependencies = ["pyserial>=3.4", "bitstring>=3.1.7"]
dynamic = ["version"]

[project.scripts]
casiocom = "casioserial.cli:main"

[project.urls]
Homepage = "https://github.com/jm-/casioserial"
Issues = "https://github.com/jm-/casioserial/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "casioserial.__version__" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=7",
]
